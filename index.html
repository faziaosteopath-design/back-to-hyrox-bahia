<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Back to HYROX">
  <meta name="theme-color" content="#23392f">
  <title>Back to HYROX - Bahia</title>
  <style>
    :root {
      color-scheme: light;
      --ivory: #fbf6ed;
      --card: #fffdfa;
      --sage: #8f9c82;
      --sage-soft: #e7ecdf;
      --forest: #23392f;
      --ink: #26302b;
      --muted: #6e746d;
      --taupe: #c8b7a4;
      --taupe-soft: #eee6da;
      --terracotta: #bd7358;
      --danger: #9a4f3b;
      --danger-soft: #f7e7df;
      --line: rgba(35, 57, 47, 0.14);
      --shadow: 0 10px 30px rgba(35, 57, 47, 0.08);
      font-family: -apple-system, BlinkMacSystemFont, "Avenir Next", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--ivory);
      color: var(--ink);
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    .app {
      width: min(100%, 440px);
      margin: 0 auto;
      min-height: 100svh;
      background: var(--ivory);
      padding-bottom: calc(86px + env(safe-area-inset-bottom));
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(251, 246, 237, 0.94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
      padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--forest);
      font-weight: 800;
      font-size: 15px;
    }
    .mark {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: var(--forest);
      color: var(--ivory);
      display: grid;
      place-items: center;
      font-family: Georgia, serif;
      font-weight: 700;
      flex: 0 0 auto;
    }
    .actions { display: flex; gap: 8px; }
    .icon-btn {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--forest);
      border-radius: 8px;
      min-width: 42px;
      height: 38px;
      padding: 0 10px;
      font-weight: 750;
      box-shadow: 0 4px 18px rgba(35, 57, 47, 0.05);
    }
    .hero {
      min-height: calc(100svh - 56px);
      display: grid;
      align-content: end;
      padding: 18px 14px 22px;
      background: var(--forest);
      color: var(--card);
      position: relative;
      overflow: hidden;
    }
    .hero img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center top;
      opacity: 0.82;
    }
    .hero::after {
      content: "";
      position: absolute;
      inset: 45% 0 0;
      background: linear-gradient(180deg, rgba(23,37,31,0), rgba(23,37,31,0.96));
    }
    .hero-copy {
      position: relative;
      z-index: 1;
      padding: 0 4px;
    }
    .eyebrow {
      color: var(--taupe-soft);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      margin: 0 0 10px;
    }
    h1, h2, h3 {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--forest);
      line-height: 1.05;
      margin: 0;
      letter-spacing: 0;
    }
    .hero h1 {
      color: var(--card);
      font-size: clamp(46px, 13vw, 64px);
      max-width: 320px;
    }
    .hero p {
      margin: 12px 0 0;
      color: var(--taupe-soft);
      line-height: 1.45;
      font-size: 15px;
    }
    .signature {
      margin-top: 24px;
      font-size: 12px;
      color: var(--taupe-soft);
    }
    .tabs {
      position: sticky;
      top: calc(59px + env(safe-area-inset-top));
      z-index: 15;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 14px;
      background: rgba(251, 246, 237, 0.96);
      border-bottom: 1px solid var(--line);
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--forest);
      border-radius: 8px;
      padding: 9px 12px;
      min-height: 38px;
      font-size: 13px;
      font-weight: 750;
      white-space: nowrap;
    }
    .tab.active {
      background: var(--forest);
      color: var(--card);
      border-color: var(--forest);
    }
    section {
      padding: 24px 14px 10px;
      scroll-margin-top: 118px;
    }
    .section-head {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
    }
    .section-head h2 { font-size: 32px; }
    .section-head p {
      margin: 0;
      color: var(--muted);
      font-size: 14.5px;
      line-height: 1.45;
    }
    .media {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      min-height: 248px;
      margin: 12px 0;
      padding: 8px;
      display: grid;
      place-items: center;
    }
    .media img {
      width: 100%;
      height: min(58svh, 430px);
      object-fit: contain;
      object-position: center center;
      display: block;
      border-radius: 6px;
      background: #f8f0e4;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 16px;
      margin: 10px 0;
    }
    .card.sage { background: var(--sage-soft); }
    .card.warn { background: var(--danger-soft); color: var(--danger); }
    .kicker {
      color: var(--terracotta);
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 850;
      margin-bottom: 8px;
    }
    .quote {
      font-family: Georgia, serif;
      font-style: italic;
      color: var(--forest);
      font-size: 22px;
      line-height: 1.22;
      margin: 4px 0 10px;
    }
    .card h3 {
      font-size: 21px;
      margin-bottom: 8px;
    }
    .card p, .card li {
      font-size: 14.5px;
      line-height: 1.46;
      color: inherit;
    }
    .card p { margin: 0; }
    .routine {
      display: grid;
      gap: 8px;
      margin: 12px 0;
    }
    .routine-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 50px;
      padding: 12px 14px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .routine-row strong { color: var(--forest); font-size: 14px; }
    .routine-row span { color: var(--terracotta); font-size: 13px; font-weight: 850; text-align: right; }
    .exercise-list, .tile-grid, .ladder, .run-list, .week-list, .template-grid {
      display: grid;
      gap: 12px;
    }
    .exercise {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .exercise img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: contain;
      object-position: center;
      display: block;
      background: #f8f0e4;
      border-bottom: 1px solid var(--line);
    }
    .exercise-body { padding: 14px; }
    .exercise h3 { font-size: 22px; margin-bottom: 10px; }
    .meta {
      display: grid;
      gap: 8px;
    }
    .meta div {
      border-left: 3px solid var(--sage);
      padding-left: 10px;
      line-height: 1.42;
      font-size: 14px;
    }
    .meta b {
      display: block;
      color: var(--forest);
      font-size: 11px;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .meta .watch { border-left-color: var(--terracotta); color: var(--danger); }
    .checklist {
      display: grid;
      gap: 9px;
      margin: 12px 0;
    }
    .check {
      min-height: 48px;
      display: grid;
      grid-template-columns: 26px 1fr;
      gap: 10px;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .check input {
      width: 22px;
      height: 22px;
      accent-color: var(--forest);
    }
    .check span {
      font-size: 14.5px;
      line-height: 1.35;
    }
    .tile {
      display: grid;
      grid-template-columns: 92px 1fr;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      min-height: 114px;
      align-items: center;
    }
    .tile img {
      width: 92px;
      height: 92px;
      object-fit: contain;
      background: #f8f0e4;
      border-radius: 6px;
      border: 1px solid var(--line);
    }
    .tile h3 {
      font-size: 17px;
      margin-bottom: 5px;
    }
    .tile strong {
      color: var(--terracotta);
      display: block;
      font-size: 13px;
      margin-bottom: 3px;
    }
    .tile p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }
    .ladder .tile {
      grid-template-columns: 74px 1fr;
      min-height: 94px;
    }
    .ladder .tile img {
      width: 74px;
      height: 74px;
    }
    .run {
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 12px;
      align-items: center;
      min-height: 54px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--card);
    }
    .number {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--sage-soft);
      color: var(--forest);
      font-weight: 850;
    }
    .week {
      background: var(--sage-soft);
      border-radius: 8px;
      padding: 14px;
      border: 1px solid var(--line);
    }
    .week h3 {
      font-size: 18px;
      margin-bottom: 6px;
    }
    .week p {
      margin: 0;
      color: var(--ink);
      font-size: 14px;
      line-height: 1.4;
    }
    .template-grid {
      grid-template-columns: 1fr 1fr;
      margin-top: 12px;
    }
    .template-item {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      min-height: 112px;
    }
    .template-item strong {
      color: var(--terracotta);
      display: block;
      font-family: Georgia, serif;
      font-size: 30px;
      line-height: 1;
      margin-bottom: 8px;
    }
    .template-item span {
      font-size: 13px;
      line-height: 1.3;
      color: var(--forest);
      font-weight: 750;
    }
    ul.clean {
      padding-left: 18px;
      margin: 8px 0 0;
    }
    ul.clean li + li { margin-top: 8px; }
    .stop-list {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }
    .stop-item {
      background: var(--danger-soft);
      border: 1px solid rgba(154, 79, 59, 0.14);
      color: var(--danger);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.34;
    }
    .references {
      margin: 28px 14px 0;
      padding: 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .references h2 {
      font-size: 18px;
      margin-bottom: 8px;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(84px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(20px);
      background: var(--forest);
      color: var(--card);
      border-radius: 8px;
      padding: 10px 14px;
      opacity: 0;
      transition: opacity 180ms ease, transform 180ms ease;
      z-index: 50;
      width: min(320px, calc(100vw - 28px));
      text-align: center;
      font-size: 13px;
      font-weight: 750;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    @media (min-width: 760px) {
      body { background: #efe7db; }
      .app {
        margin: 28px auto;
        min-height: auto;
        border: 1px solid var(--line);
        box-shadow: 0 24px 80px rgba(35, 57, 47, 0.18);
      }
      .hero { min-height: 780px; }
    }
    @media print {
      .topbar, .tabs, .toast { display: none; }
      .app { width: 100%; padding-bottom: 0; }
      section { break-inside: avoid; }
    }
  </style>
</head>

  <script id="app-data" type="application/json">{"sections":[{"id":"start","label":"Start","title":"Back to HYROX","subtitle":"Postnatal performance plan for Bahia","date":"HYROX Abu Dhabi - 25 October 2026","image":"cover","cards":[{"kicker":"honest goal","title":"Finish well, guided by response","body":"This may be realistic because Bahia is active, has already started pelvic-floor and deep-core rehabilitation, and is racing Doubles. It is still ambitious: HYROX includes 8 km of running and 8 functional stations."},{"kicker":"principle","quote":"Progress is earned by response, not by date.","body":"Running and impact begin only from about 12 weeks postpartum, after reassessment and symptom-free readiness testing.","tone":"sage"}]},{"id":"criteria","label":"Criteria","title":"Green-Light Before Running","subtitle":"All checks should be symptom-free during training and for 24 hours afterwards.","image":"runningMan","checklist":["30-minute walk","Single-leg balance: 10 seconds each side","10 controlled single-leg squats each side","Jogging on the spot for 1 minute","10 forward bounds","10 hops on each leg","10 running-man repetitions each side"],"warning":"Pain, pelvic heaviness, dragging, leakage, bleeding, abdominal doming or loss of control means no running yet."},{"id":"foundation","label":"Daily","title":"Daily Foundation","subtitle":"A calm 10-18 minute reset. Precise, controlled, and never forced.","routine":[["Breathing + pelvic floor","3-5 min"],["Deep core + heel slides","2 x 6 each"],["Glute bridges","2 x 8-10"],["Side plank from knees","2 x 15-25 sec"],["Goblet squat","2 x 8"],["Supported split squat","2 x 6 each"]],"exercises":[{"title":"360 Breathing + Pelvic Floor","img":"breathing","dose":"3-5 minutes daily","cue":"Inhale wide into ribs, back and pelvis. Exhale softly; lift the pelvic floor, then fully let go.","watch":"Do not grip, squeeze the glutes, hold the breath, or keep the pelvic floor switched on all day."},{"title":"Deep Core + Heel Slides","img":"heelSlide","dose":"2 x 6 each side","cue":"Exhale before the slide; keep ribs heavy and lower abdomen flat without forcing it inward.","watch":"Stop if the abdomen domes, the back arches, or pelvic pressure appears."},{"title":"Glute Bridge","img":"bridge","dose":"2 x 8-10","cue":"Exhale, press through heels, lift hips, then lower with control.","watch":"Avoid breath-holding, over-arching, or pushing into symptoms."},{"title":"Side Plank From Knees","img":"sidePlank","dose":"2 x 15-25 sec each side","cue":"Elbow under shoulder, hips stacked, neck long. Exhale gently as you lift.","watch":"Avoid sagging, twisting, shoulder shrugging, doming or pelvic heaviness."},{"title":"Goblet Squat","img":"gobletSquat","dose":"2 x 8","cue":"Inhale down, exhale as you stand. Keep ribs stacked over pelvis.","watch":"Avoid breath-holding, dropping too deep before control is ready, or bearing down."},{"title":"Supported Split Squat","img":"splitSquat","dose":"2 x 6 each side","cue":"Use support. Stay tall, move slowly, and exhale as you rise.","watch":"Avoid wobbling through the pelvis, pain, pressure, or turning it into a jump."}]},{"id":"strength","label":"Strength","title":"Strength Foundation","subtitle":"RPE 5-7. Finish each set with 2-4 clean reps in reserve.","tiles":[["Squat pattern","gobletSquat","2-4 x 6-10 reps","Range first, then load. Exhale to stand."],["Hip hinge / RDL","farmer","2-3 x 6-8 reps","Hips move back; spine stays long."],["Bridge / hip thrust","bridge","2-4 x 8-12 reps","Pause at the top without rib flare."],["Split squat","splitSquat","2-3 x 6-8 each","Use support first; keep breathing."],["Calf raises","calfRaise","2-3 x 10-15 reps","Build before pogo hops or running."],["Rows","row","2-3 x 8-12 reps","Pull with ribs stacked; no hard bracing."],["Farmer carries","farmer","20-40 m","Walk tall, breathe, avoid bearing down."],["Anti-rotation core","skierg","2 x 6-8 each","Stay still through ribs and pelvis."]],"warning":"Breath-holding, excessive abdominal pressure, doming, pelvic heaviness or leakage means reduce the load."},{"id":"hyrox","label":"HYROX","title":"HYROX Movement Prep","subtitle":"Technique and breathing before intensity. Controlled load before racing load.","tiles":[["SkiErg","skierg","4-6 x 100 m easy","Exhale on the pull; keep ribs down."],["Sled Push","sledPush","4-6 x 10-15 m","Start light and short; partner can take more."],["Sled Pull","skierg","Technique only at first","Small sets, long rest, no straining."],["Rowing","row","4-6 x 200 m easy","Smooth legs-body-arms rhythm."],["Farmer Carry","farmer","20-30 m switches","Keep shoulders quiet and breathing calm."],["Sandbag Lunges","sandbag","5-6 light steps","Start unloaded or very light."],["Wall Balls","wallBall","5-10 reps at a time","Exhale through the throw."],["Burpee Broad Jumps","bounds","Step-back burpees only first","Broad jumps wait for impact clearance."]]},{"id":"impact","label":"Impact","title":"Impact Ladder","subtitle":"No progression unless symptoms stay absent during training and for 24 hours afterwards.","ladder":[["Brisk walking","jogging"],["Fast marching","runningMan"],["Calf raises","calfRaise"],["Single-leg control","singleLegSquat"],["Low pogo hops","jogging"],["Forward bounds","bounds"],["Walk-run intervals","run"],["Easy continuous running","run"]],"runs":["6 x 1 min run / 2 min walk","8 x 1 min run / 2 min walk","6 x 2 min run / 1 min walk","6 x 3 min run / 1 min walk","4 x 5 min run / 1 min walk","20-25 min easy continuous, only if fully symptom-free"]},{"id":"roadmap","label":"Plan","title":"Seven-Week Road Map","subtitle":"A progressive path toward race day, not a date-based clearance.","weeks":[["Weeks 1-2","Pelvic floor, breathing, deep core, hypopressives as taught, strength basics and low-impact cardio."],["Week 3","Impact preparation plus clinical reassessment. Running starts only if timing, symptoms and tests agree."],["Weeks 4-5","Walk-run progression, low-volume HYROX technique and careful load practice."],["Week 6","Partner rehearsal at 60-70% race volume. Never a full HYROX simulation."],["Race week","Taper, mobility, easy movement, sleep, hydration and final go/no-go decision."]],"template":[["2","strength sessions"],["2","low-impact engine or HYROX technique sessions"],["2","run or impact sessions only once cleared"],["1+","full recovery day"]],"warning":"Poor sleep, marked fatigue or postnatal symptoms = reduce intensity, not recovery."},{"id":"doubles","label":"Doubles","title":"Doubles Strategy","subtitle":"Both partners run every 1 km together. Workout stations can be shared.","image":"wallBall","cards":[{"kicker":"partner load","title":"Partner takes more early","body":"Burpee broad jumps, heavy sled work, sandbag lunges and wall balls are higher-impact or higher-pressure stations. Bahia can use shorter sets and planned transitions."},{"kicker":"test in training","title":"Rehearse the switches","body":"SkiErg and row: 250 m switches. Farmer carry: 20-30 m switches. Wall balls: 5-10 reps at a time. Decide before race day.","tone":"sage"}]},{"id":"race","label":"Race","title":"Race Week + Stop Rules","subtitle":"The strongest return is the one her body can sustain.","image":"run","bullets":["No heavy training in the final 72 hours.","Use familiar food and hydration.","Wear a supportive sports bra and comfortable clothing.","Keep the first half controlled.","Exhale on effort; do not constantly grip the pelvic floor.","Stop if symptoms appear.","Check symptoms immediately after, that evening and the next morning."],"stop":["Pelvic heaviness, dragging or bulging","Urine or bowel leakage","Pelvic, perineal, abdominal, scar or lower-back pain","Increasing bleeding","Marked fatigue or dizziness","Symptoms lasting more than 24 hours"]}],"images":{"cover":"data:image/webp;base64,UklGRigYAQBXRUJQVlA4IBwYAQAQtwadASroA9wFPj0ejUUiIamjodHpKTAHiWlu19acTYEcRovufJF/7MxZ5E75R6So+/90mjim2rj/UBPMhyfKCH+w/a/1680qjF/5vUi/Y/+T1Lv+r0Zf2/nM6DteZFv7rSD6v6m0+V9R035t//F+y3wQ/VH7DfA5+   <script>
    const data = JSON.parse(document.getElementById('app-data').textContent);
    const app = document.getElementById('app');
    const img = (key, alt='') => `<img src="${data.images[key]}" alt="${alt}">`;
    const esc = (value) => String(value).replace(/[&<>"']/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    const showToast = (message) => {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    };
    function cardHTML(card) {
      const cls = card.tone === 'sage' ? ' card sage' : 'card';
      return `<article class="${cls}">
        ${card.kicker ? `<div class="kicker">${esc(card.kicker)}</div>` : ''}
        ${card.quote ? `<div class="quote">${esc(card.quote)}</div>` : `<h3>${esc(card.title)}</h3>`}
        <p>${esc(card.body)}</p>
      </article>`;
    }
    function sectionHTML(section) {
      const head = `<section id="${section.id}">
        <div class="section-head">
          <h2>${esc(section.title)}</h2>
          ${section.subtitle ? `<p>${esc(section.subtitle)}</p>` : ''}
        </div>`;
      if (section.id === 'start') {
        return `<div class="hero" id="start">
          ${img(section.image, 'Bahia holding a kettlebell in training clothes')}
          <div class="hero-copy">
            <p class="eyebrow">Postnatal performance plan</p>
            <h1>Back to HYROX</h1>
            <p>${esc(section.subtitle)}<br>${esc(section.date)}</p>
            <div class="signature">Fazia Amrane, Senior Osteopath<br>Powered by Fazia AMRANE Osteopath</div>
          </div>
        </div>
        <section>
          ${section.cards.map(cardHTML).join('')}
        </section>`;
      }
      if (section.checklist) {
        return head + `<div class="media">${img(section.image, section.title)}</div>
          <div class="checklist">
            ${section.checklist.map((item, i) => `<label class="check"><input type="checkbox" data-check="${section.id}-${i}"><span>${esc(item)}</span></label>`).join('')}
          </div>
          <article class="card warn"><p>${esc(section.warning)}</p></article>
        </section>`;
      }
      if (section.routine) {
        return head + `<div class="routine">
          ${section.routine.map(([name, dose]) => `<div class="routine-row"><strong>${esc(name)}</strong><span>${esc(dose)}</span></div>`).join('')}
        </div>
        <article class="card sage"><p>Hypopressives: only as previously taught by the practitioner.</p></article>
        <div class="exercise-list">
          ${section.exercises.map((ex) => `<article class="exercise">
            ${img(ex.img, ex.title)}
            <div class="exercise-body">
              <h3>${esc(ex.title)}</h3>
              <div class="meta">
                <div><b>Dose</b>${esc(ex.dose)}</div>
                <div><b>Key cue</b>${esc(ex.cue)}</div>
                <div class="watch"><b>Watch</b>${esc(ex.watch)}</div>
              </div>
            </div>
          </article>`).join('')}
        </div></section>`;
      }
      if (section.tiles) {
        return head + `<div class="tile-grid">
          ${section.tiles.map(([title, imageKey, dose, cue]) => `<article class="tile">
            ${img(imageKey, title)}
            <div><h3>${esc(title)}</h3><strong>${esc(dose)}</strong><p>${esc(cue)}</p></div>
          </article>`).join('')}
        </div>
        ${section.warning ? `<article class="card warn"><p>${esc(section.warning)}</p></article>` : ''}
        </section>`;
      }
      if (section.ladder) {
        return head + `<div class="ladder">
          ${section.ladder.map(([title, imageKey], i) => `<article class="tile">
            ${img(imageKey, title)}
            <div><h3>${i + 1}. ${esc(title)}</h3><p>Progress only when symptoms stay absent.</p></div>
          </article>`).join('')}
        </div>
        <article class="card warn"><p>Begin running only from about 12 weeks postpartum, after reassessment and all green-light tests are symptom-free.</p></article>
        <div class="run-list">
          ${section.runs.map((run, i) => `<div class="run"><div class="number">${i + 1}</div><span>${esc(run)}</span></div>`).join('')}
        </div></section>`;
      }
      if (section.weeks) {
        return head + `<div class="week-list">
          ${section.weeks.map(([week, text]) => `<article class="week"><h3>${esc(week)}</h3><p>${esc(text)}</p></article>`).join('')}
        </div>
        <div class="template-grid">
          ${section.template.map(([num, label]) => `<div class="template-item"><strong>${esc(num)}</strong><span>${esc(label)}</span></div>`).join('')}
        </div>
        <article class="card warn"><p>${esc(section.warning)}</p></article></section>`;
      }
      if (section.cards) {
        return head + `<div class="media">${img(section.image, section.title)}</div>
          ${section.cards.map(cardHTML).join('')}
        </section>`;
      }
      if (section.stop) {
        return head + `<div class="media">${img(section.image, section.title)}</div>
        <article class="card"><ul class="clean">${section.bullets.map((item) => `<li>${esc(item)}</li>`).join('')}</ul></article>
        <div class="stop-list">${section.stop.map((item) => `<div class="stop-item">${esc(item)}</div>`).join('')}</div>
        </section>`;
      }
      return head + '</section>';
    }
    const tabs = data.sections.map((section) => `<button class="tab" data-jump="${section.id}">${esc(section.label)}</button>`).join('');
    app.innerHTML = `
      <div class="topbar">
        <div class="brand"><div class="mark">H</div><span>Back to HYROX</span></div>
        <div class="actions">
          <button class="icon-btn" id="shareBtn" aria-label="Share">Share</button>
          <button class="icon-btn" id="printBtn" aria-label="Print">PDF</button>
        </div>
      </div>
      <nav class="tabs" aria-label="Guide sections">${tabs}</nav>
      ${data.sections.map(sectionHTML).join('')}
      <aside class="references">
        <h2>Clinical Source Notes</h2>
        This guide organizes a practitioner-led plan. It is not a stand-alone clearance decision. Source framing checked against ACOG postpartum exercise guidance, NHS postnatal exercise guidance, Goom-Donnelly-Brockwell return-to-running postnatal guidelines, and HYROX official race-format notes.
      </aside>
    `;
    document.querySelectorAll('[data-jump]').forEach((button) => {
      button.addEventListener('click', () => document.getElementById(button.dataset.jump).scrollIntoView({ behavior: 'smooth', block: 'start' }));
    });
    document.querySelectorAll('[data-check]').forEach((box) => {
      const key = 'bahia-hyrox-' + box.dataset.check;
      box.checked = localStorage.getItem(key) === 'true';
      box.addEventListener('change', () => localStorage.setItem(key, String(box.checked)));
    });
    const observer = new IntersectionObserver((entries) => {
      const visible = entries.filter(entry => entry.isIntersecting).sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
      if (!visible) return;
      document.querySelectorAll('.tab').forEach(tab => tab.classList.toggle('active', tab.dataset.jump === visible.target.id));
    }, { rootMargin: '-42% 0px -50% 0px', threshold: [0.01, 0.4, 0.8] });
    data.sections.forEach(section => {
      const el = document.getElementById(section.id);
      if (el) observer.observe(el);
    });
    document.getElementById('printBtn').addEventListener('click', () => window.print());
    document.getElementById('shareBtn').addEventListener('click', async () => {
      const shareData = { title: 'Back to HYROX - Bahia', text: 'Postnatal performance plan for HYROX Abu Dhabi.', url: location.href };
      try {
        if (navigator.share) {
          await navigator.share(shareData);
        } else if (navigator.clipboard) {
          await navigator.clipboard.writeText(location.href);
          showToast('Link copied');
        } else {
          showToast('Share from your browser menu');
        }
      } catch (error) {
        showToast('Share cancelled');
      }
    });
  </script>
</body>
</html>
